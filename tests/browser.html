<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación del detector · Vuelo Verde</title><body><h1>Verificación del detector de postura</h1><p>Esta prueba carga el modelo y analiza una imagen vacía. No enciende la cámara.</p><button id="run">Probar detector</button><pre id="result">Pendiente</pre><script type="module">
const button=document.querySelector('#run'),result=document.querySelector('#result');
button.onclick=()=>{button.disabled=true;result.textContent='Cargando modelo…';const worker=new Worker('../src/pose-worker.js');const timeout=setTimeout(()=>{result.textContent='ERROR: tiempo de carga agotado';worker.terminate();button.disabled=false;},60000);worker.onerror=e=>{result.textContent='ERROR: '+e.message;clearTimeout(timeout);worker.terminate();button.disabled=false;};worker.onmessage=async({data})=>{if(data.type==='ready'){result.textContent='Modelo listo. Probando inferencia…';const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;const ctx=canvas.getContext('2d');ctx.fillStyle='#d0e0c0';ctx.fillRect(0,0,640,480);const bitmap=await createImageBitmap(canvas);worker.postMessage({type:'frame',bitmap,time:performance.now()},[bitmap]);}else{result.textContent=data.type==='pose'?'CORRECTO: modelo cargado e inferencia completada. Imagen vacía: '+(data.points===null?'sin persona, como se esperaba.':'se detectó una pose inesperada.'):'ERROR: '+data.message;clearTimeout(timeout);worker.terminate();button.disabled=false;}};worker.postMessage({type:'init'});};
</script></body></html>
